name: loan_calculator
description: Bank loan calculator with interest computation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: IBM Plex Sans Hebrew
      fonts:
        - asset: assets/fonts/IBMPlexSansHebrew-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansHebrew-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansHebrew-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansHebrew-Bold.ttf
          weight: 700
