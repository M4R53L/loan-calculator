name: LoanCalculator
options:
  bundleIdPrefix: io.github.m4r53l
  developmentLanguage: he
  deploymentTarget:
    iOS: "17.0"
# Signing team comes from Local.xcconfig, which is not committed
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
targets:
  LoanCalculator:
    type: application
    platform: iOS
    sources: [LoanCalculator]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.m4r53l.LoanCalculator
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: מחשבון הלוואה
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Only HTTPS through URLSession, which is exempt from export rules
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  LoanCalculatorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LoanCalculatorTests]
    dependencies:
      - target: LoanCalculator
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LoanCalculatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LoanCalculatorUITests]
    dependencies:
      - target: LoanCalculator
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LoanCalculator:
    build:
      targets:
        LoanCalculator: all
    test:
      targets: [LoanCalculatorTests, LoanCalculatorUITests]
